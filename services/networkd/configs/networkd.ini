; networkd.ini - libsystemd unit, starts networkd at boot so it owns every
; network interface's RX pump thread (see ../docs/README.md and
; ../src/networkd.c). Plain unit, no device match needed - dmnetif
; interfaces are enumerated once at networkd's own startup, not reported
; through libsystemd's device-rules mechanism.
description=Owns every network interface's RX pump thread
exec=networkd
type=simple
