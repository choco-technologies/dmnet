; networkd@.ini - libsystemd unit template, one instance per network
; interface. Not started on its own: dmnetif reports every interface it
; registers as a "netif" class device, and networkd.rules maps that class
; here, so libsystemd instantiates networkd@<interface> for each one - the
; same shape console@.ini has for tty nodes.
;
; %i is the interface name ("eth0"), which is all src/networkd.c needs to
; find the interface. %v carries the backing device path, should a future
; key need it.
description=RX pump for %i
exec=networkd
args=%i
type=simple
