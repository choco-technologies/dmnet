; wifid@.ini - libsystemd unit template, one instance per network interface.
; Not started on its own: dmnetif reports every interface it registers as a
; "netif" class device and wifid.rules maps that class here. On an interface that
; is not a Wi-Fi one wifid ends at once; on a Wi-Fi one it stays and keeps it
; connected to a network saved in the "wifi" vault of dmsecrets (see ../README.md).
;
; %i is the interface name ("wlan0").
description=Connect %i to a saved Wi-Fi network
exec=wifid
args=%i
type=simple
